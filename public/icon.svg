<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <g transform="translate(80, 100)">
    <!-- Panel 1 -->
    <rect x="0" y="0" width="104" height="312" rx="16" fill="url(#panelGrad)"/>
    <!-- Panel 2 -->
    <rect x="124" y="0" width="104" height="312" rx="16" fill="url(#panelGrad)"/>
    <!-- Panel 3 -->
    <rect x="248" y="0" width="104" height="312" rx="16" fill="url(#panelGrad)"/>
    
    <!-- Seamless Sun & Horizon overlay inside panels with clip paths -->
    <circle cx="176" cy="110" r="44" fill="#fbbf24" opacity="0.95"/>
    <path d="M0,220 Q88,170 176,210 T352,190 L352,312 L0,312 Z" fill="#10b981" opacity="0.85"/>
    
    <!-- Split cut lines highlight -->
    <line x1="114" y1="20" x2="114" y2="292" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,6" opacity="0.7"/>
    <line x1="238" y1="20" x2="238" y2="292" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,6" opacity="0.7"/>
  </g>
</svg>